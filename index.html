<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 급식</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      text-align: center;
    }

    .school {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .date {
      text-align: center;
      margin: 10px 0 30px;
    }

    #meal {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🍚 오늘의 급식</h1>

  <div class="school">
    경북대학교사범대학부설고등학교
  </div>

  <div class="date" id="date"></div>

  <div id="meal">
    급식 정보를 불러오는 중입니다...
  </div>

  <div class="buttons">
    <button onclick="changeDate(-1)">어제</button>
    <button onclick="goToday()">오늘</button>
    <button onclick="changeDate(1)">내일</button>
  </div>


<script>

  let selectedDate = new Date();


  function formatDate(date) {

    const year = date.getFullYear();

    const month =
      String(date.getMonth() + 1).padStart(2, "0");

    const day =
      String(date.getDate()).padStart(2, "0");

    return year + month + day;
  }


  function displayDate(date) {

    document.getElementById("date").textContent =
      date.getFullYear() + "년 "
      + (date.getMonth() + 1) + "월 "
      + date.getDate() + "일";
  }


  async function loadMeal() {

    displayDate(selectedDate);

    document.getElementById("meal").innerHTML =
      "급식 정보를 불러오는 중입니다...";

    const mealDate = formatDate(selectedDate);

    // NEIS에 직접 접속하지 않고
    // 우리가 만든 Vercel 서버에 요청합니다.
    const url =
      "/api/meal?date=" + mealDate;


    try {

      const response = await fetch(url);

      const data = await response.json();


      if (!data.mealServiceDietInfo) {

        document.getElementById("meal").innerHTML =
          "🍽️ 이 날짜에는 급식 정보가 없습니다.";

        return;
      }


      const meals =
        data.mealServiceDietInfo[1].row;


      const lunch =
        meals.find(
          meal => meal.MMEAL_SC_NM === "중식"
        );


      if (!lunch) {

        document.getElementById("meal").innerHTML =
          "중식 정보가 없습니다.";

        return;
      }


      const menu =
        lunch.DDISH_NM.replaceAll("<br/>", "<br>");


      document.getElementById("meal").innerHTML =
        "<h2>오늘의 메뉴</h2>"
        + menu;

    }

    catch (error) {

      console.error(error);

      document.getElementById("meal").innerHTML =
        "급식 정보를 불러오지 못했습니다.";

    }

  }


  function changeDate(day) {

    selectedDate.setDate(
      selectedDate.getDate() + day
    );

    loadMeal();
  }


  function goToday() {

    selectedDate = new Date();

    loadMeal();
  }


  loadMeal();

</script>

</body>
</html>
